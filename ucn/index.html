<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UCN</title>
    <style>
        div {
            font-size: 100px;
            color: red;
        }
    </style>
</head>
<body>
    <main><h1>Score: 0</h1></main>
    <div><p></p></div>
    <script>
        //const buttons = ["1", "2", "3", "4", "5", "6", "x", "z", "w", "a", "s", "d", "f", "c", " "]
        const buttons = ["1", "3", "5", "z", "w", "a", "s", "d", "f", "c", " "]
        let button = "1";
        let p = document.querySelector("p");
        let h1 = document.querySelector("h1");
        let score = 0;
        let gameInterval;
        let timeLeft = 2000;

        p.textContent = "1";

        document.addEventListener('keydown', (event)=> {    
            console.log(event.key);
            if (event.key == button) {
                p.style.fontSize = "150%";
                random_buttons();
                clearInterval(gameInterval);
                score += timeLeft * 0.5;
                h1.textContent = "Score: " + score;
                timeLeft = 2000;
                gameInterval = setInterval(() => {
                    p.style.fontSize = "100%";
                    timeLeft -= 100;
                    if (timeLeft <= 0) {
                        p.style.fontSize = "50%";
                        score -= 2000;
                        h1.textContent = "Score: " + score;
                        random_buttons();
                        timeLeft = 2000;
                    }
                },100);
            } else {
                score -= 50;
                h1.textContent = "Score: " + score;
            }
        });

        function random_buttons() {
            button = buttons[Math.floor(Math.random() * buttons.length)];
            if (button == " ") {
                p.textContent = "Space";
            } else {
                p.textContent = button;
            }
        }
    </script>
</body>
</html>
